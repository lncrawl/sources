name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: Layout and references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - run: python .github/scripts/check_layout.py

  schema:
    name: Documents match the published schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install jsonschema pyyaml

      # Needs only the committed schema, so it runs before the interpreter is published.
      # It catches unknown keys, wrong types and bad shapes. The cross-field rules a
      # schema cannot express are the interpreter's job, below.
      - run: python .github/scripts/check_schema.py

  spec:
    name: Interpreter checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The version pinned inside schema/source.v1.json, not whatever is latest. The
      # schema is regenerated below, so an unpinned install would let an interpreter
      # release fail a source pull request that did not touch either.
      - name: Read the pinned interpreter
        id: pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          schema = json.load(open("schema/source.v1.json"))
          print(f"requirement={schema['x-generator']}")
          PY

      # Deliberately not lncrawl. The definitions repo validates itself, which is the
      # whole point of keeping the interpreter in its own package.
      - name: Install the interpreter
        id: install
        continue-on-error: true
        run: pip install "${{ steps.pin.outputs.requirement }}"

      - name: Validate every spec
        if: steps.install.outcome == 'success'
        run: sourcelib check specs base --strict

      # Offline, against recorded pages, so a pull request cannot be failed by a site being
      # slow or by a rate limit. Fixtures test the spec; the nightly health sweep tests the
      # site, and a green suite here does not mean a host is still alive.
      - name: Replay recorded fixtures
        if: steps.install.outcome == 'success'
        run: sourcelib check --fixtures

      - name: Assert the committed schema is what the model generates
        if: steps.install.outcome == 'success'
        run: sourcelib schema -o schema/source.v1.json --check

      - name: Report a missing interpreter
        if: steps.install.outcome != 'success'
        run: |
          echo "::warning::${{ steps.pin.outputs.requirement }} is not installable yet," \
               "so the interpreter checks were skipped. Layout and schema still ran."
