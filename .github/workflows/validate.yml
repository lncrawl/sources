name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Specs, layout and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The interpreter comes from .python-version, which names the floor rather than the newest
      # release. A hook has to run on the oldest Python lncrawl-sourcelib supports, and the floor
      # is where a 3.10-only spelling shows up.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Every tool the gates need is a dev dependency, so the task list in pyproject.toml is the
      # same one a contributor runs. Deliberately no lncrawl: the definitions repository validates
      # itself, which is the whole point of keeping the interpreter in its own package.
      - name: Install the tools
        run: uv sync

      # These read only the committed schema and the tree, so they run before the interpreter is
      # involved and still report on a pull request that predates a release.
      - run: uv run poe lint
      - run: uv run poe layout
      - run: uv run poe schema

      # The version pinned inside schema/source.v1.json, not whatever resolves. The schema is
      # regenerated below, so an unpinned install would let an interpreter release fail a source
      # pull request that touched neither.
      #
      # Asking the index whether that version exists, rather than trying the install and treating
      # any failure as "not published yet". Those are different things: the first is a legitimate
      # skip while a release is in flight, the second is a broken workflow, and collapsing them
      # once meant a malformed requirement skipped every gate below and still reported success.
      - name: Read the pinned interpreter
        id: pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import urllib.error
          import urllib.request

          name, _, version = json.load(open("schema/source.v1.json"))["x-generator"].partition("==")
          # The extra belongs to the name, not to the version: `pkg[fetch]==1.0`, never
          # `pkg==1.0[fetch]`, which is not a requirement at all.
          print(f"requirement={name}[fetch]=={version}")
          print(f"pinned={name}=={version}")

          url = f"https://pypi.org/pypi/{name}/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  published = response.status == 200
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              published = False
          print(f"published={str(published).lower()}")
          PY

      # No continue-on-error: the version is known to exist, so a failure here is real.
      - name: Install the pinned interpreter
        if: steps.pin.outputs.published == 'true'
        run: uv pip install "${{ steps.pin.outputs.requirement }}"

      # `poe check` passes --strict, which fails when the checker found nothing. That catches a
      # wrong path, a wrong working directory or a broken glob silently validating zero documents.
      #
      # `poe fixtures` replays recorded pages offline, so a pull request cannot be failed by a site
      # being slow or by a rate limit. Fixtures test the spec; the nightly health sweep tests the
      # site, and a green suite here does not mean a host is still alive.
      - name: Run the interpreter gates
        if: steps.pin.outputs.published == 'true'
        run: uv run poe pin && uv run poe check && uv run poe fixtures

      - name: Assert the committed schema is what the model generates
        if: steps.pin.outputs.published == 'true'
        run: uv run sourcelib schema -o schema/source.v1.json --check

      - name: Report an unpublished interpreter
        if: steps.pin.outputs.published != 'true'
        run: |
          echo "::warning::${{ steps.pin.outputs.pinned }} is not on PyPI yet, so the interpreter" \
               "checks were skipped. Lint, layout and schema still ran."
