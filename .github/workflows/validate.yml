name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: Layout and references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - run: python .github/scripts/check_layout.py

  spec:
    name: Schema and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Deliberately not lncrawl. The definitions repo validates itself, which is the
      # whole point of keeping the interpreter in its own package.
      - name: Install the interpreter
        id: install
        continue-on-error: true
        run: pip install lncrawl-sourcelib

      - name: Validate every spec against the schema
        if: steps.install.outcome == 'success'
        run: sourcelib check --strict

      - name: Replay recorded fixtures
        if: steps.install.outcome == 'success'
        run: sourcelib check --fixtures

      - name: Report a missing interpreter
        if: steps.install.outcome != 'success'
        run: |
          echo "::warning::lncrawl-sourcelib is not installable yet, so schema and" \
               "fixture checks were skipped. Only the layout job ran."
