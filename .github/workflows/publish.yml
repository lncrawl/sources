name: Publish manifest

# Tag-gated, not merge-gated. Merging to main reaches nobody: what installed apps receive is
# decided by pushing a tag, so a batch of source fixes goes out when it is deliberately
# released rather than the moment each one lands.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish. Defaults to the ref this was started from.
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.name }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync

      # The same task names a contributor runs, so a release cannot be gated on a check nobody
      # can reproduce locally. Not the interpreter gates: those belong to validate.yml, which
      # already ran on the commit this tag points at.
      - run: uv run poe layout
      - run: uv run poe schema

      - name: Build
        run: |
          mkdir -p dist
          uv run python .github/scripts/build_manifest.py -o dist/manifest.json
          cp -r specs disabled base hooks dist/
          printf '%s\n' "${{ steps.ref.outputs.name }}" > dist/VERSION
          # Without an index the site root is a 404 while every file under it serves
          # correctly, which reads as a failed deploy to anyone who types the URL.
          uv run python .github/scripts/build_index.py \
            --manifest dist/manifest.json \
            --release "${{ steps.ref.outputs.name }}" \
            -o dist/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
