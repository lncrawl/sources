name: Health

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  probe:
    name: Probe live hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml

      - name: Probe
        run: python .github/scripts/check_health.py -o health.json

      - uses: actions/upload-artifact@v7
        with:
          name: health
          path: health.json
          retention-days: 30

      - name: Summarise
        if: always()
        run: python .github/scripts/summarise_health.py health.json >> "$GITHUB_STEP_SUMMARY"
