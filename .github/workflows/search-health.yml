name: Search health

# Nothing else tests a `search` stage: `try` skips it, a recording does not capture it, and the
# rest of CI never runs it. A site does not report the failure either — a renamed form field or a
# dropped class answers 200 with the empty results page — so a search that finds nothing is
# indistinguishable from a search nobody has used. Seven hosts were in that state on 2026-08-09.
#
# The query is the title of the novel each host's own fixture was recorded from, so every host is
# asked for a book it demonstrably carries and there is no list of search terms to maintain.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      hosts:
        description: "Space separated hosts to check. Empty means every fixture."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: search-health
  cancel-in-progress: false

jobs:
  search:
    name: Ask every host for its own novel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - name: Check
        run: |
          uv run python .github/scripts/search_health.py ${{ inputs.hosts }} \
            --output search-health.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: search-health
          path: search-health.json
          retention-days: 30
