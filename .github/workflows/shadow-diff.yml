name: Shadow diff

# While a host is served by a spec here and still has a legacy Python crawler in the
# app, both can be run against the same novel and compared. That keeps a converted
# source verified continuously rather than only on the day it was written, and it is
# the only check that notices a fix landing on the legacy side and never reaching here.
#
# Retire this workflow when the legacy tier is gone; it has nothing to compare against.
#
# THE COMPARISON STEP DOES NOT EXIST YET, so the nightly schedule is off. It invoked
# `sourcelib shadow-diff`, which was never implemented, and every run since this file
# was added failed in seconds on `invalid choice: 'shadow-diff'`. A permanently red
# nightly is worse than an absent one: it trains everybody to ignore this repo's CI.
#
# It cannot be implemented where it was called from. `sourcelib` must never import
# `lncrawl` — that rule is what keeps phase 5 a deletion rather than a rewrite — and a
# shadow diff has to drive both tiers. So the comparison belongs either in the crawler
# repo, which may depend on `sourcelib`, or in a script here that drives the two as
# subprocesses. Neither tier currently has a command that dumps a normalised novel as
# JSON, and that is the missing piece.
#
# `health.yml` already probes the live hosts nightly, so nothing is unguarded by this
# being off except the cross-tier drift it was written for, which has never been guarded.

on:
  workflow_dispatch:
    inputs:
      hosts:
        description: "Space separated hosts to compare. Empty means all overlapping."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: shadow-diff
  cancel-in-progress: false

jobs:
  diff:
    name: Compare tiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: sources

      - uses: actions/checkout@v7
        with:
          repository: lncrawl/lightnovel-crawler
          ref: dev
          path: lncrawl

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install both tiers
        run: |
          pip install lncrawl-sourcelib
          pip install ./lncrawl

      - name: Diff
        working-directory: sources
        run: |
          echo "::error::shadow-diff is not implemented. Neither tier has a command that"
          echo "::error::dumps a normalised novel as JSON, which is what the comparison needs."
          echo "::error::See the comment at the top of this workflow for where it should live."
          exit 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shadow-diff
          path: sources/shadow.json
          retention-days: 30
