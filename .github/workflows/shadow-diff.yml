name: Shadow diff

# While a host is served by a spec here and still has a legacy Python crawler in the
# app, both can be run against the same novel and compared. That keeps a converted
# source verified continuously rather than only on the day it was written, and it is
# the only check that notices a fix landing on the legacy side and never reaching here.
#
# Retire this workflow when the legacy tier is gone; it has nothing to compare against.
#
# The comparison lives here rather than in the interpreter because `sourcelib` must never
# import `lncrawl`, and it drives the crawler as a subprocess rather than importing it,
# which also keeps this Apache-licensed repository from linking a GPL one.
#
# Every URL comes from a recorded fixture, so a run compares the hosts this repository has
# already committed to and does not depend on a listing page still repeating its shape.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      hosts:
        description: "Space separated hosts to compare. Empty means every fixture."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: shadow-diff
  cancel-in-progress: false

jobs:
  diff:
    name: Compare tiers
    runs-on: ubuntu-latest
    # A live run over every fixture, twice each. Bounded so a hung host fails the job
    # rather than holding a runner for six hours.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: sources

      - uses: actions/checkout@v7
        with:
          repository: lncrawl/lightnovel-crawler
          ref: dev
          path: lncrawl

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install both tiers
        run: |
          pip install lncrawl-sourcelib
          pip install ./lncrawl

      - name: Diff
        working-directory: sources
        run: |
          python .github/scripts/shadow_diff.py ${{ inputs.hosts }} \
            --timeout 240 \
            --output shadow.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shadow-diff
          path: sources/shadow.json
          retention-days: 30
