# The FreeWebNovel family.
spec: 1

rate_limit: 2

search:
  request:
    post: "{origin}/search/"
    payload:
      searchkey: "{query}"
  css: ".col-content .con .txt h3 a"
  fields:
    title: { attr: [title, text] }
    url: { attr: href }

novel:
  title: { css: ".m-desc h1.tit, h1.tit" }
  cover: { css: ".m-imgtxt img", attr: [data-src, src] }
  authors: { css: ".m-imgtxt a[href*='/authors/']", all: true }
  tags: { css: ".m-imgtxt a[href*='/genres/'], .tags a", all: true }
  synopsis: { css: ".m-desc .txt, .inner" }

toc:
  request:
    page: novel
    paginate:
      # The theme reports its length as one `#indexselect` option per page of forty, and every
      # option carries the same `value`: the pager is driven by script, so the page total is the
      # number of options and is nowhere else in the markup. `while` walked it speculatively
      # instead, and on a long novel a single trial ran past ten minutes; this reads the same
      # novel in twenty-one seconds.
      last: { css: "#indexselect option", all: true, pipe: [count] }
      url: "{novel_url}?page={page}"
  items:
    css: "#idData li > a"
    fields:
      title: { attr: [title, text] }
      url: { attr: href }

chapter:
  body:
    css: ".m-read .txt, .m-read"
    pipe:
      # The theme prints the chapter heading and footnote markers inside the body.
      - strip_tags: [h1, h2, h3, h4, sub]
      - paragraphs
