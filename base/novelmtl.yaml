# The NovelMTL family, machine-translated novels behind one theme: 18 sources extend this.
spec: 1

rate_limit: 1.4

search:
  request:
    # The form carries hidden inputs generated per visit, so the only valid request is one built
    # from the form itself. `form` harvests them and `payload` supplies the one field a spec knows,
    # then the request goes to the form's own action.
    get: "{origin}/search.html"
    form: '.search-container form[method="post"]'
    payload:
      keyboard: "{query}"
  css: "ul.novel-list .novel-item a"
  fields:
    title: { css: .novel-title }
    url: { attr: href }
    info: { css: .novel-stats, all: true, pipe: [trim, drop_empty, { join: " | " }] }

novel:
  title: { css: ".novel-info .novel-title" }
  cover: { css: "figure.cover img", attr: [data-src, src] }
  authors: { css: '.novel-info .author span[itemprop="author"]', all: true }
  tags: { css: ".categories a", all: true }
  synopsis: { css: ".summary .content" }

toc:
  request:
    get: "{novel_url}"
    paginate:
      # Followed rather than numbered, and that is not a preference. The theme pages a hundred at a
      # time through an ajax endpoint whose `page` is zero-based, so the first extra page is
      # `page=1` while `{page}` would start at 2 and silently drop a hundred chapters. The numbered
      # links are no better: they stop at 8 on a novel that has fourteen pages.
      #
      # The `>` link is the second to last row, after the numbers and before `>>`, which jumps to
      # the end. Nothing distinguishes them but position.
      # Sequential by nature: each page's address is only known once the previous one is read, so
      # this trades the concurrency `count` would allow for a walk that does not lose pages.
      next: { css: "ul.pagination li:nth-last-child(2) a", attr: href }
  items:
    css: "ul.chapter-list li a"
    fields:
      # The row text leads with the chapter number, which the title then repeats.
      title: { css: .chapter-title }
      url: { attr: href }

chapter:
  body:
    css: .chapter-content
    pipe:
      - paragraphs: { block_tags: [p] }
    # Most bodies open by repeating the chapter heading, and `drop_leading` cannot remove it here.
    # The theme writes some chapters as `<p>` elements and others as bare text separated by `<br>`,
    # and in the second shape the heading is a text node rather than a block, which is the only
    # thing the step can match. Reordering it after `paragraphs` does not help: that step yields
    # html and the pipe cannot turn html back into a node.
    #
    # Left in the body deliberately rather than removed by a fragile pattern. The Python this
    # replaces did not strip it either, so nothing regresses.
