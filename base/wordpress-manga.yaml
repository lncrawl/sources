# The manga variant of the Madara theme.
spec: 1
extends: base/wordpress.yaml

has_manga: true
can_search: false

pipes:
  clean_body:
    # The theme leaves a hidden input carrying the chapter id inside the reader.
    - strip_css: [input]
    # Pages arrive with their real source in data-src and a placeholder in src.
    - unlazy_images
    - keep_attrs: [src, alt]

chapter:
  body:
    css: div.reading-content
