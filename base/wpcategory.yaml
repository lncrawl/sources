# WordPress sites where a novel is a category and each chapter is a post in it: 8 sources
# extend this.
#
# The novel comes from the REST API rather than the rendered page. These themes show only a page
# or two of the newest chapters and often no pager at all, so the HTML never holds the whole list,
# and the category endpoint already carries the title and synopsis.
spec: 1

vars:
  # The category slug, from the novel URL itself. No document is involved.
  slug:
    on: url
    regex: "/category/([^/?#]+)"
  # The numeric id the posts endpoint needs, off the category document the novel stage fetched.
  category_id:
    on: novel
    json: "0.id"

search:
  request:
    get: "{origin}/wp-json/wp/v2/categories?search={query|urlencode}&per_page=20&_fields=id,name,slug,count,parent,link"
  json: "$"
  fields:
    title: { json: name, pipe: [parse_html, text, trim] }
    url: { json: link }
    info: { json: count, pipe: [{ replace: { pattern: "$", with: " chapters" } }] }

novel:
  request:
    get: "{origin}/wp-json/wp/v2/categories?slug={vars.slug}&_fields=id,name,count,description"
  # Both read row 0: a slug lookup returns a one-element array.
  title: { json: "0.name", pipe: [parse_html, text, trim] }
  synopsis: { json: "0.description" }

toc:
  request:
    get: "{origin}/wp-json/wp/v2/posts?categories={vars.category_id}&per_page=100&page=1&orderby=date&order=asc&_fields=link,title"
    paginate:
      # The feed reports its own length, so the walk has a known end. Stopping when a page looks
      # empty is how a partial list gets mistaken for a whole one.
      last: { header: X-WP-TotalPages }
      url: "{origin}/wp-json/wp/v2/posts?categories={vars.category_id}&per_page=100&page={page}&orderby=date&order=asc&_fields=link,title"
  items:
    json: "$"
    fields:
      # Ordering is publication date, which is what the request asks for. Chapter numbers are
      # deliberately unused: these sites bundle chapters into one post, number by volume, and
      # carry the occasional six-digit typo, so any order derived from the numbers is worse.
      title: { json: "title.rendered", pipe: [parse_html, text, trim] }
      url: { json: link }

chapter:
  body: { css: .entry-content }
