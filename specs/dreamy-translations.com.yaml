spec: 1
base_url: https://dreamy-translations.com/

novel: {}

toc:
  request:
    get: "{novel_url}"
  items:
    css: "div.flex-1.min-h-0.overflow-y-auto a[href]"
    fields:
      # The row is three things in one anchor: a number, a name, and a view count in the block
      # on the right. Taking the row's own text runs all three together and ends every chapter
      # title with a number that is not part of it, so each is read separately and joined here.
      number: { css: "span.font-medium" }
      name: { css: "p.text-xs" }
      title: { const: "{item.number} {item.name}" }
      url: { attr: href }

chapter:
  body:
    css: "article.chapter-content"
