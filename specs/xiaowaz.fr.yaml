spec: 1
base_url: https://xiaowaz.fr/

novel:
  # The detail block is prose: each fact is a bolded French label followed by its value, and the
  # genre list is one comma-separated line rather than links.
  authors: { regex: "Auteur(?:&nbsp;|\\s)*:</strong>\\s*([^<\\n]{2,60})" }
  tags:
    regex: "Genres\\s*:\\s*([^<\\n]{2,120})"
    pipe: [{ split: "," }, trim, drop_empty]
  # The document title appends the site name.
  title: { css: "h1" }
  cover: { css: "img.wp-post-image", attr: src }

toc:
  request:
    get: "{novel_url}"
  items:
    # A List Category Posts widget, oldest first, holding only this series' chapter posts.
    css: "#lcp_instance_0 a[href]"
    fields:
      title: {}
      url: { attr: href }

chapter:
  body:
    css: "div.entry-content"
    pipe:
      # The post carries its own prev/next bar and the translator's author card, both inside the
      # body element rather than around it.
      - strip_css: [".wp-post-navigation", ".abh_box", ".saboxplugin-wrap", ".sharedaddy"]
      - paragraphs
