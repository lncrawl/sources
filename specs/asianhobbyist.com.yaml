spec: 1
base_url: https://asianhobbyist.com/

novel:
  # The document title appends the site's name, and the metadata chain would record it.
  title: { css: "h1.entry-title" }

toc:
  request:
    get: "{novel_url}"
  items:
    css: "div.flex.tableBody a[href]"
    fields:
      title: {}
      url: { attr: href }

chapter:
  body:
    css: "div.mainBody.m0a"
