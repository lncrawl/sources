# Wattpad. Every page on the site is built by script from its own API, and that API is public and
# unauthenticated for a published story, so nothing here reads markup: the novel, its chapter list
# and its tags all come from one response, and a chapter body from one more.
spec: 1
base_url: https://www.wattpad.com/

vars:
  # Deliberately only the story form. A part URL also carries a number, and taking that one would
  # ask the story endpoint for a chapter id and get a 404 with nothing to say why.
  story: { on: url, regex: "/story/(\\d+)" }

search:
  request:
    get: "{origin}/api/v3/stories?query={query|urlencode}&limit=20"
  json: "stories"
  fields:
    title: { json: "title" }
    url: { json: "url" }

novel:
  request:
    get: "{origin}/api/v3/stories/{vars.story}"
  title: { json: "title" }
  cover: { json: "cover" }
  # The account that posted it, which on this site is the author.
  authors: { json: "user.name" }
  synopsis: { json: "description" }
  tags: { json: "tags", all: true }

toc:
  request:
    # The story response carries every part, so the list costs no request of its own.
    page: novel
  items:
    json: "parts"
    fields:
      id: { json: "id" }
      title: { json: "title" }
      url: { json: "url" }

chapter:
  request:
    # The address the site's own reader is handed for a part, with the page left empty. That is
    # not an omission: a part over about six thousand characters is served in pages, and the
    # empty parameter is what returns all of them in one response.
    get: "{origin}/apiv2/?m=storytext&id={chapter.id}&page="
  body: { css: "body" }
