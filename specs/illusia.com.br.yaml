spec: 1
extends: base/fictioneer.yaml
base_url: https://illusia.com.br/

# This deployment runs an older build of the theme: the chapter list, the genre pills and the
# chapter body all match the base, but it carries neither `story__identity-title` nor
# `story__thumbnail-image`. Both fall through to the OpenGraph chain of section 3.8, which reads
# them correctly. Verified through a browser on 2026-08-07, since the host cannot be fetched.
#
# No title rule of its own: the crawler took the og:title minus its last space-separated token,
# because the site used to append its name. That tag now reads "Elysium Drama" on its own, so the
# rule would cut a word off every title.
novel:
  # `a.author` links the account that posted the translation rather than the novel's author.
  authors: null
