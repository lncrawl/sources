spec: 1
extends: base/mangastream.yaml
base_url: https://jobnib.com/

search:
  # This deployment renders its results as its own cards rather than the theme's `.bsx` grid, so
  # the family's selector matched nothing and the stage returned no results without failing.
  # Probed 2026-08-09: 6 rows.
  css: "div.listupd .jn-sr-card"
  fields:
    title: { css: "h2.jn-sr-title a", attr: [title, text] }
    url: { css: "h2.jn-sr-title a", attr: href }
    info: { css: "span.jn-sr-score" }
