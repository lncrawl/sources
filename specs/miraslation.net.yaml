spec: 1
base_url: https://www.miraslation.net/

novel:
  synopsis: { css: "div.prose.line-clamp-5" }
  # Every page of this theme titles itself after the site, and its h1 is the site name
  # too; the novel is named only in the link the breadcrumb points back to.
  title: { css: "a.link.link-secondary" }

toc:
  request:
    get: "{novel_url}"
  items:
    css: "ul.w-full.menu a[href]"
    fields:
      title: {}
      url: { attr: href }

chapter:
  body:
    css: "main.roboto-serif.prose"
