spec: 1
base_url: https://wuxiasky.net/

novel:
  title:
    css: "div.story__identity h1.story__identity-title"
  cover:
    css: ".story__thumbnail a"
    attr: [content, data-src, src]
  authors:
    css: "div.story__identity div.story__identity-meta a.author"
    all: true

toc:
  request:
    get: "{novel_url}"
  items:
    css: "section.story__chapters li > a"
    fields:
      title: {}
      url: { attr: href }

chapter:
  body:
    css: "section#chapter-content"
