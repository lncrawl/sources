spec: 1
base_url: https://ifreedom.su/

novel:
  # The document title appends the site name.
  title: { css: "h1" }

toc:
  request:
    get: "{novel_url}"
  items:
    # Newest first, and a chapter still behind the site's wallet links there instead.
    css: "div.chapterlinks a[href]:not([href*='koshelek'])"
    reverse: true
    fields:
      title: {}
      url: { attr: href }

chapter:
  body:
    css: "div.chapter-content"
