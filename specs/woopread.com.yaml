spec: 1
extends: base/wordpress.yaml
base_url: https://woopread.com/

# The search URL answers with the home page whatever is asked for. Entering a novel URL works.
can_search: false

novel:
  # This deployment fills the theme's own cover slot with a placeholder, so the OpenGraph image is
  # the reliable one. The theme's selector stays behind it for a page that has no meta tag.
  cover:
    css: 'meta[property="og:image"]'
    attr: content
    fallback:
      - { css: ".summary_image a img", attr: [data-src, src] }
  # The whole block's text, not its anchors: this site writes the author as plain text.
  authors: { css: ".author-content" }

chapter:
  body:
    # The body div carries a generated id per chapter, so the prefix is the only stable handle:
    # the Tailwind utility classes around it say nothing about content, and the theme this spec
    # was written against is gone.
    css: "div[id^='chapter-']"
    pipe:
      - strip_matching: { pattern: '^\s*(Translator|Editor):', tags: [p] }
      - clean_body

toc:
  request:
    from: null
    page: novel
  items:
    # A Tailwind theme, not madara. The link's own text carries a relative timestamp after the
    # title, so the title comes from the label the theme writes for a screen reader instead.
    css: "#chapter-list-container a[href]"
    fields:
      title:
        attr: [aria-label, text]
        pipe: [{ regex: { pattern: "^Read chapter [^:]*:\\s*(.+)$" } }, trim]
      url: { attr: href }
