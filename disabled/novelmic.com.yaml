spec: 1
extends: base/wordpress-manga.yaml
base_url: https://novelmic.com/
disabled: "Domain is parked on parklogic."

novel:
  title:
    css: meta[property="og:title"]
    attr: content
    pipe:
    - regex:
        pattern: ^(.*?)\s*\\s*\S+$
    - trim
  cover:
    css: meta[property="og:image"]
    attr: content
