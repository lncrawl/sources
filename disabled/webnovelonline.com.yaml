disabled: "2026-08-11: a 2,909-byte shell over a backend that will not answer. Rendering works as far as the catalogue — /novels yields /novel/<id> links — but a rendered novel page carries the title and about 3 KB of text with no chapter link at all, and neither /novel/<id>/chapters nor ?tab=chapters adds one. Its backend, webapi.novelfulll.com, answers {\"errcode\":401,\"msg\":\"未登录\"} to every route tried."
