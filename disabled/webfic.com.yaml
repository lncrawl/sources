# Webfic. A Next.js site whose pages carry their data in the hydration payload rather than in the
# markup, so every field here is read out of that script. The one exception is the chapter list,
# which the catalogue page also renders as ordinary links.
spec: 1
base_url: https://www.webfic.com/
disabled: "A paid platform, and its own payload says so: a locked chapter answers `unlock: false` with a `price` in coins and a 900-character preview in the field the free ones use for the whole text. Measured 2026-08-09 on a 1570-chapter novel: chapters 1, 2 and 19 read in full at 5 to 6 thousand characters, 775 and 776 priced at 10 and 9 coins. The spec below reads the list correctly and would deliver a book of previews, which is worse than not serving the host at all. The catalogue payload marks each row `unlock`, so if the site ever opens its back catalogue this needs only a `require` to become useful."
language: en

vars:
  # The catalogue is addressed by the numeric book id, which only the novel URL carries.
  book: { on: url, regex: "/book_info/(\\d+)" }

novel:
  title: { css: "script#__NEXT_DATA__", json: "props.pageProps.bookInfo.bookName" }
  cover: { css: "script#__NEXT_DATA__", json: "props.pageProps.bookInfo.cover" }
  authors: { css: "script#__NEXT_DATA__", json: "props.pageProps.bookInfo.author" }
  synopsis: { css: "script#__NEXT_DATA__", json: "props.pageProps.bookInfo.introduction" }

toc:
  request:
    get: "{origin}/catalog/{vars.book}"
    paginate:
      # The catalogue prints every page number and jumps to the last, so the largest wins.
      last:
        css: "a[href*='/catalog/']"
        attr: href
        all: true
        pipe: [{ regex: { pattern: "/catalog/\\d+/(\\d+)" } }, max]
      url: "{origin}/catalog/{vars.book}/{page}"
  items:
    # The rows are real links, which is why nothing here reads the payload: the reader's address
    # already carries the slug and the chapter id, and building it from JSON would only be a
    # second way to say the same thing.
    # Scoped away from the page's "Read Now" button, which links the first chapter again and
    # would otherwise arrive as a duplicate row at the top of every novel.
    css: "div[class*='chapterTable'] a[href^='/book/']"
    # Every row carries a second, empty anchor to the same chapter, so half the rows arrive with
    # no title and the list comes back at twice its length. Requiring the title is what drops
    # them; nothing distinguishes the two anchors but their text.
    require: [title]
    fields:
      title: {}
      url: { attr: href }

chapter:
  # The reader renders its text from the payload, so the served markup holds a heading and nothing
  # else. `parse_html` is what turns the string into a document the default pipe can walk.
  body:
    css: "script#__NEXT_DATA__"
    json: "props.pageProps.chapterInfo.content"
